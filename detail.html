<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Produk — Anredseller</title>
    <meta
      name="description"
      content="Detail produk lengkap dengan spesifikasi, ulasan, dan harga terbaik."
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/store.css" />
    <link rel="stylesheet" href="css/editorial.css" />
  </head>
  <body>
    <!-- TOP BAR -->
    <div id="store-header"></div>

    <!-- NAV KATEGORI -->

    <!-- BREADCRUMB -->
    <div
      style="
        background: var(--abu-muda);
        border-bottom: 1px solid var(--abu-border);
      "
    >
      <div class="container">
        <nav class="breadcrumb">
          <a href="index.html">Beranda</a>
          <span class="breadcrumb-sep">›</span>
          <a href="produk.html" id="bc-kategori">Produk</a>
          <span class="breadcrumb-sep">›</span>
          <span class="breadcrumb-aktif" id="bc-nama">Loading...</span>
        </nav>
      </div>
    </div>

    <!-- DETAIL PRODUK -->
    <div class="container">
      <div class="detail-layout" id="detail-wrapper">
        <!-- Diisi JS -->
        <div
          style="
            grid-column: 1/-1;
            text-align: center;
            padding: 80px;
            color: var(--abu-teks);
          "
        >
          <div style="font-size: 40px; margin-bottom: 12px">🔄</div>
          <p>Memuat produk...</p>
        </div>
      </div>

      <!-- PRODUK TERKAIT -->
      <div style="padding-bottom: 60px">
        <div
          class="section-header"
          style="
            margin-top: 0;
            padding-top: 20px;
            border-top: 2px solid var(--abu-border);
          "
        >
          <h2 class="section-judul">Produk Serupa</h2>
          <a href="produk.html" class="lihat-semua">Lihat semua →</a>
        </div>
        <div class="grid-produk" id="grid-serupa"></div>
      </div>
    </div>

    <!-- FOOTER -->
    <div id="store-footer"></div>

    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
    <script src="js/reviews.js"></script>
    <script src="js/detail.js"></script>
    <script src="js/store.js"></script>
  </body>
</html>
