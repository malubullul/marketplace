# Optional standalone export only. The repository root render.yaml deploys
# both services from main; use that Blueprint for the one-repository setup.
services:
  - type: web
    name: anredseller-admin
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --no-control-socket --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: ANREDSELLER_BACKEND_URL
        sync: false
      - key: ANREDSELLER_SHOP_URL
        sync: false
      - key: ANREDSELLER_ADMIN_GATEWAY_KEY
        sync: false
      - key: ANREDSELLER_SECURE_COOKIES
        value: "1"
